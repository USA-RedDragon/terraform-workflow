name: Terraform

on:
  workflow_call:
    inputs:
      plan:
        type: boolean
        required: false
        default: true
        description: 'Whether to plan the Terraform changes'
      apply:
        type: boolean
        required: false
        default: false
        description: 'Whether to apply the Terraform changes'
      destroy:
        type: boolean
        default: false
        required: false
        description: 'Whether to destroy the Terraform resources'
      working-directory:
        type: string
        required: false
        default: '.'
        description: 'The working directory to run Terraform commands in. The module name will be appended to this path'
      gcp-auth:
        type: boolean
        required: false
        default: false
        description: 'Whether to authenticate to Google Cloud'
      github-app-auth:
        type: boolean
        required: false
        default: false
        description: 'Whether to authenticate using a GitHub App'
      github-app-owner:
        type: string
        required: false
        default: ''
        description: 'The owner to scope the GitHub App token to. Defaults to the owner of the calling repository'
      github-app-repositories:
        type: string
        required: false
        default: ''
        description: 'Comma or newline-separated list of repositories to scope the GitHub App token to (e.g. a shared Terraform modules repo). If empty and github-app-owner is unset, the token is scoped to the calling repository'
      gcp-token-format:
        type: string
        required: false
        default: 'access_token'
        description: 'The format of the GCP token'
      aws-auth:
        type: boolean
        required: false
        default: false
        description: 'Whether to authenticate to AWS'
      aws-region:
        type: string
        required: false
        description: 'The AWS region'
    secrets:
      app-id:
        required: false
        description: 'The GitHub App ID'
      app-private-key:
        required: false
        description: 'The GitHub App private key'
      gcp-workload-identity-provider:
        required: false
        description: 'The GCP workload identity provider'
      gcp-service-account:
        required: false
        description: 'The GCP service account'
      aws-role-to-assume:
        required: false
        description: 'The AWS role to assume'
      aws-role-session-name:
        required: false
        description: 'The AWS role session name'
      secrets:
        required: false
        description: >-
          Newline-delimited NAME: VALUE pairs exported into the environment of
          every Terraform step. Each line is NAME, a colon, then the value --
          the caller interpolates its own secret into the value.
          Provider-agnostic on purpose: a new provider adds a line here rather
          than a new input to this workflow. Values are masked before export.

env:
  # Disable Terraform telemetry
  CHECKPOINT_DISABLE: "true"

jobs:
  matrix:
    name: Generate job matrices
    runs-on: ubuntu-22.04
    if: inputs.working-directory != '.'
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Generate matrix
        id: matrix
        uses: hellofresh/action-changed-files@f6db62a551af02bb4bbc88ce6536bf40aa537e8f # v3.0.1
        with:
            pattern: ${{ inputs.working-directory }}/(?P<match>[^/]+)

  terraform:
    name: Terraform
    runs-on: ubuntu-22.04
    if: inputs.working-directory == '.'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Generate GitHub App Token
        if: inputs.github-app-auth
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        id: app-token
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ inputs.github-app-owner }}
          repositories: ${{ inputs.github-app-repositories }}

      - name: Setup GitHub App Token
        id: setup-token
        if: inputs.github-app-auth
        run: |
          git config --global url."https://oauth2:${TOKEN}@github.com".insteadOf https://github.com
          git config --global --add url."https://oauth2:${TOKEN}@github.com".insteadOf ssh://git@github.com
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Authenticate to Google Cloud
        if: inputs.gcp-auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        id: gcp-auth
        with:
          workload_identity_provider: ${{ secrets.gcp-workload-identity-provider }}
          service_account: ${{ secrets.gcp-service-account }}
          token_format: ${{ inputs.gcp-token-format }}

      - name: Set Google Cloud access token
        if: inputs.gcp-auth
        run: echo "GOOGLE_OAUTH_ACCESS_TOKEN=${{ steps.gcp-auth.outputs.access_token }}" >> $GITHUB_ENV

      - name: Authenticate to AWS
        if: inputs.aws-auth
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.aws-role-to-assume }}
          role-session-name: ${{ secrets.aws-role-session-name }}
          aws-region: ${{ inputs.aws-region }}

      - name: Export caller-supplied secrets
        env:
          EXTRA_SECRETS: ${{ secrets.secrets }}
        run: |
          set -euo pipefail
          # Guarded here, not in `if:` -- the `secrets` context is NOT available
          # in a step-level condition (github/needs/strategy/matrix/job/runner/
          # env/vars/steps/inputs only), and using it there is a workflow file
          # validation error rather than a runtime one.
          if [ -z "${EXTRA_SECRETS//[[:space:]]/}" ]; then
            echo "no caller-supplied secrets"
            exit 0
          fi
          # Split on the FIRST colon only: a value may contain colons (an ARN, a
          # URL, a JSON blob). Blank lines and # comments are skipped.
          while IFS= read -r line; do
            [ -z "${line// }" ] && continue
            case "$line" in \#*) continue ;; esac
            name="${line%%:*}"
            value="${line#*:}"
            name="$(printf '%s' "$name" | tr -d '[:space:]')"
            value="${value# }"
            if [ -z "$name" ] || [ "$name" = "$line" ]; then
              echo "::error::secrets line is not NAME: VALUE -- '$line'" >&2
              exit 1
            fi
            # Mask BEFORE writing: a value in $GITHUB_ENV without this can
            # surface in any later step's log.
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done <<< "$EXTRA_SECRETS"

      - name: Terraform Init
        id: init
        run: terraform init -no-color
        continue-on-error: true

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        continue-on-error: true

      - name: Terraform Plan
        id: plan
        if: inputs.plan || inputs.apply
        run: |
          set +e
          terraform plan -no-color -out=plan.out -detailed-exitcode
          EXITCODE=$?
          if [[ $EXITCODE -eq 2 ]]; then
            echo "Plan succeeded with a diff"
            echo "diff=true" >> $GITHUB_OUTPUT
            exit 0
          elif [[ $EXITCODE -eq 0 ]]; then
            echo "Plan succeeded with no diff"
            echo "diff=false" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Plan failed"
            echo "diff=false" >> $GITHUB_OUTPUT
            exit 1
          fi
        continue-on-error: true

      - name: Terraform Apply
        id: apply
        if: inputs.apply
        run: terraform apply -auto-approve -no-color plan.out

      - name: Terraform Destroy
        id: destroy
        if: inputs.destroy
        run: terraform destroy -auto-approve -no-color

      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        if: github.event_name == 'pull_request'
        id: github-script
        env:
          FMT: "${{ steps.fmt.outputs.stdout }}"
          INIT: "${{ steps.init.outputs.stderr }}"
          VALIDATE: "${{ steps.validate.outputs.stderr }}"
          PLAN_OUT: "${{ steps.plan.outputs.stdout }}"
          PLAN_ERR: "${{ steps.plan.outputs.stderr }}"
        with:
          result-encoding: string
          script: |
            let comment = `## Terraform Checks\n\n`;

            if ("${{ steps.fmt.outcome }}" == "success") {
              comment += `\n#### ✅ Terraform Format and Style Passed`;
            } else {
              // Split the output into an array of strings
              let fileList = process.env.FMT.split("\n");
              // Remove any empty lines from the array
              fileList = fileList.filter((item) => item.trim() !== "");
              fileList = fileList.map((item) => `<li><code>${item}</code></li>\n`);
              filesString = fileList.join("\n");
              comment += `\n#### ❌ Terraform Format and Style Failed
            <details>
            <summary>Failed Files</summary>
            <ul>
              ${filesString}
            </ul>
            </details>\n`;
            }

            if ("${{ steps.init.outcome }}" == "success") {
              comment += `\n#### ✅ Terraform Initialization Passed`;
            } else {
              comment += `\n#### ❌ Terraform Initialization Failed
            <details>
            <summary><code>terraform init</code> output</summary>
            <pre>\n
            ${process.env.INIT}
            </pre>\n
            </details>\n`;
            }

            if ("${{ steps.validate.outcome }}" == "success") {
              comment += `\n#### ✅ Terraform Validation Passed`;
            } else {
              comment += `\n#### ❌ Terraform Validation Failed
            <details>
            <summary><code>terraform validate</code> output</summary>
            <pre>\n
            ${process.env.VALIDATE}
            </pre>\n
            </details>\n`;
            }

            if ("${{ inputs.plan }}" == "true") {
              if ("${{ steps.plan.outputs.diff }}" == "true") {
                comment += `\n#### 📜 Terraform Plan Has Changes\n`;
              } else if ("${{ steps.plan.outcome }}" == "success") {
                comment += `\n#### ✅ Terraform Plan Has No Changes\n`;
              }

              if ("${{ steps.plan.outcome }}" == "success") {
                comment += `\n#### ✅ Terraform Plan Passed`;
              } else {
                comment += `\n#### ❌ Terraform Plan Failed`;
              }
              comment += `
              <details>
              <summary><code>terraform plan</code> output</summary>\n
              \`\`\`hcl\n`;

              if ("${{ steps.plan.outcome }}" == "success") {
                comment += `${process.env.PLAN_OUT}`;
              } else {
                comment += `${process.env.PLAN_ERR}`;
              }
              
              comment += `
              \`\`\`\n
              </details>`;
            }

            return comment;

      - name: Find Comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          comment-author: github-actions[bot]
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: '## Terraform Checks'

      - name: Create comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.github-script.outputs.result }}

      - name: Error if failed
        if: steps.fmt.outcome == 'failure' || steps.validate.outcome == 'failure' || steps.init.outcome == 'failure' || steps.plan.outcome == 'failure' || steps.apply.outcome == 'failure' || steps.destroy.outcome == 'failure'
        run: exit 1

  terraform-matrix:
    name: ${{ matrix.match }}
    runs-on: ubuntu-22.04
    needs: [matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    # skip if the matrix is empty
    if: fromJson(needs.matrix.outputs.matrix).include[0] && inputs.working-directory != '.'
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}/${{ matrix.match }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Generate GitHub App Token
        if: inputs.github-app-auth
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        id: app-token
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ inputs.github-app-owner }}
          repositories: ${{ inputs.github-app-repositories }}

      - name: Setup GitHub App Token
        id: setup-token
        if: inputs.github-app-auth
        run: |
          git config --global url."https://oauth2:${TOKEN}@github.com".insteadOf https://github.com
          git config --global --add url."https://oauth2:${TOKEN}@github.com".insteadOf ssh://git@github.com
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Authenticate to Google Cloud
        if: inputs.gcp-auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        id: gcp-auth
        with:
          workload_identity_provider: ${{ secrets.gcp-workload-identity-provider }}
          service_account: ${{ secrets.gcp-service-account }}
          token_format: ${{ inputs.gcp-token-format }}

      - name: Set Google Cloud access token
        if: inputs.gcp-auth
        run: echo "GOOGLE_OAUTH_ACCESS_TOKEN=${{ steps.gcp-auth.outputs.access_token }}" >> $GITHUB_ENV

      - name: Authenticate to AWS
        if: inputs.aws-auth
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.aws-role-to-assume }}
          role-session-name: ${{ secrets.aws-role-session-name }}
          aws-region: ${{ inputs.aws-region }}

      - name: Export caller-supplied secrets
        env:
          EXTRA_SECRETS: ${{ secrets.secrets }}
        run: |
          set -euo pipefail
          # Guarded here, not in `if:` -- the `secrets` context is NOT available
          # in a step-level condition (github/needs/strategy/matrix/job/runner/
          # env/vars/steps/inputs only), and using it there is a workflow file
          # validation error rather than a runtime one.
          if [ -z "${EXTRA_SECRETS//[[:space:]]/}" ]; then
            echo "no caller-supplied secrets"
            exit 0
          fi
          # Split on the FIRST colon only: a value may contain colons (an ARN, a
          # URL, a JSON blob). Blank lines and # comments are skipped.
          while IFS= read -r line; do
            [ -z "${line// }" ] && continue
            case "$line" in \#*) continue ;; esac
            name="${line%%:*}"
            value="${line#*:}"
            name="$(printf '%s' "$name" | tr -d '[:space:]')"
            value="${value# }"
            if [ -z "$name" ] || [ "$name" = "$line" ]; then
              echo "::error::secrets line is not NAME: VALUE -- '$line'" >&2
              exit 1
            fi
            # Mask BEFORE writing: a value in $GITHUB_ENV without this can
            # surface in any later step's log.
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done <<< "$EXTRA_SECRETS"

      - name: Terraform Init
        id: init
        run: terraform init -no-color
        continue-on-error: true

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        continue-on-error: true

      - name: Terraform Plan
        id: plan
        if: inputs.plan || inputs.apply
        run: |
          set +e
          terraform plan -no-color -out=plan.out -detailed-exitcode
          EXITCODE=$?
          if [[ $EXITCODE -eq 2 ]]; then
            echo "Plan succeeded with a diff"
            echo "diff=true" >> $GITHUB_OUTPUT
            exit 0
          elif [[ $EXITCODE -eq 0 ]]; then
            echo "Plan succeeded with no diff"
            echo "diff=false" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Plan failed"
            echo "diff=false" >> $GITHUB_OUTPUT
            exit 1
          fi
        continue-on-error: true

      - name: Terraform Apply
        id: apply
        if: inputs.apply
        run: terraform apply -auto-approve -no-color plan.out

      - name: Terraform Destroy
        id: destroy
        if: inputs.destroy
        run: terraform destroy -auto-approve -no-color

      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        if: github.event_name == 'pull_request'
        id: github-script
        env:
          FMT: "${{ steps.fmt.outputs.stdout }}"
          INIT: "${{ steps.init.outputs.stderr }}"
          VALIDATE: "${{ steps.validate.outputs.stderr }}"
          PLAN_OUT: "${{ steps.plan.outputs.stdout }}"
          PLAN_ERR: "${{ steps.plan.outputs.stderr }}"
        with:
          result-encoding: string
          script: |
            let comment = `## \`${{ matrix.match }}\` Terraform Checks\n\n`;

            if ("${{ steps.fmt.outcome }}" == "success") {
              comment += `\n#### ✅ Terraform Format and Style Passed`;
            } else {
              // Split the output into an array of strings
              let fileList = process.env.FMT.split("\n");
              // Remove any empty lines from the array
              fileList = fileList.filter((item) => item.trim() !== "");
              fileList = fileList.map((item) => `<li><code>${item}</code></li>\n`);
              filesString = fileList.join("\n");
              comment += `\n#### ❌ Terraform Format and Style Failed
            <details>
            <summary>Failed Files</summary>
            <ul>
              ${filesString}
            </ul>
            </details>\n`;
            }

            if ("${{ steps.init.outcome }}" == "success") {
              comment += `\n#### ✅ Terraform Initialization Passed`;
            } else {
              comment += `\n#### ❌ Terraform Initialization Failed
            <details>
            <summary><code>terraform init</code> output</summary>
            <pre>\n
            ${process.env.INIT}
            </pre>\n
            </details>\n`;
            }

            if ("${{ steps.validate.outcome }}" == "success") {
              comment += `\n#### ✅ Terraform Validation Passed`;
            } else {
              comment += `\n#### ❌ Terraform Validation Failed
            <details>
            <summary><code>terraform validate</code> output</summary>
            <pre>\n
            ${process.env.VALIDATE}
            </pre>\n
            </details>\n`;
            }

            if ("${{ inputs.plan }}" == "true") {
              if ("${{ steps.plan.outputs.diff }}" == "true") {
                comment += `\n#### 📜 Terraform Plan Has Changes\n`;
              } else if ("${{ steps.plan.outcome }}" == "success") {
                comment += `\n#### ✅ Terraform Plan Has No Changes\n`;
              }

              if ("${{ steps.plan.outcome }}" == "success") {
                comment += `\n#### ✅ Terraform Plan Passed`;
              } else {
                comment += `\n#### ❌ Terraform Plan Failed`;
              }
              comment += `
              <details>
              <summary><code>terraform plan</code> output</summary>\n
              \`\`\`hcl\n`;

              if ("${{ steps.plan.outcome }}" == "success") {
                comment += `${process.env.PLAN_OUT}`;
              } else {
                comment += `${process.env.PLAN_ERR}`;
              }
              
              comment += `
              \`\`\`\n
              </details>`;
            }

            return comment;

      - name: Find Comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          comment-author: github-actions[bot]
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: '## `${{ matrix.match }}` Terraform Checks'

      - name: Create comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.github-script.outputs.result }}

      - name: Error if failed
        if: steps.fmt.outcome == 'failure' || steps.validate.outcome == 'failure' || steps.init.outcome == 'failure' || steps.plan.outcome == 'failure' || steps.apply.outcome == 'failure' || steps.destroy.outcome == 'failure'
        run: exit 1

  # This adds an extra status check representing if all of the matrix jobs passed
  # since GitHub actions doesn't let you specify all members of a matrix without having
  # to maintain that list
  terraform-results:
    if: always()
    needs: [ terraform, terraform-matrix ]
    runs-on: ubuntu-22.04
    steps:
      - run: |
          result="${{ needs.terraform-matrix.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            echo "All modules passed"
          else
            echo "One or more modules failed" >&2
            exit 1
          fi
          result="${{ needs.terraform.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            echo "All modules passed"
          else
            echo "One or more modules failed" >&2
            exit 1
          fi
